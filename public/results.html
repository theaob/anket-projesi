<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Canlı Sonuçlar</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="emoji-burst.js"></script>
    <style>
        .code-badge {
            text-align: center;
            font-size: 1rem;
            color: var(--primary-dark);
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }

        .error-state {
            text-align: center;
            color: #dc2626;
        }

        /* Toggle */
        .toggle-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .toggle-btn {
            width: auto;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(15, 23, 42, 0.1);
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-color: transparent;
            color: white;
        }

        /* Horizontal bars (default) */
        #chart.horizontal .bar-container {
            background: rgba(99, 102, 241, 0.08);
            border-radius: 50px;
            height: 12px;
            margin-bottom: 20px;
        }

        #chart.horizontal .bar {
            height: 100%;
            border-radius: 50px;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #chart.horizontal .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        /* Vertical bars */
        #chart.vertical {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 16px;
            height: 260px;
            padding-bottom: 0;
        }

        #chart.vertical .col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            flex: 1;
            max-width: 100px;
            height: 100%;
        }

        #chart.vertical .v-bar-wrap {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 100%;
            flex: 1;
        }

        #chart.vertical .v-bar {
            width: 100%;
            border-radius: 10px 10px 0 0;
            background: linear-gradient(180deg, #ec4899, #6366f1);
            transition: height 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-height: 4px;
        }

        #chart.vertical .v-label {
            font-size: 0.78rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 8px;
            word-break: break-word;
        }

        #chart.vertical .v-count {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container" style="max-width:800px;">
        <div class="code-badge" id="code-label"></div>
        <h1 id="title">Canlı Sonuçlar</h1>

        <div class="toggle-row">
            <button class="toggle-btn active" id="btn-horizontal" onclick="setMode('horizontal')">▬ Yatay</button>
            <button class="toggle-btn" id="btn-vertical" onclick="setMode('vertical')">▮ Dikey</button>
        </div>

        <div id="chart" class="horizontal"></div>
    </div>

    <script>
        const socket = io();
        let opts = [];
        let lastVotes = {};
        let mode = 'horizontal';
        let built = false;

        const params = new URLSearchParams(location.search);
        const code = params.get('code');

        if (!code) {
            document.getElementById('chart').innerHTML = '<p class="error-state">Lütfen ?code=XXXX parametresi ile açın.</p>';
        } else {
            document.getElementById('code-label').innerText = `KOD: ${code}`;
            socket.emit('joinResults', code);
        }

        socket.on('init', data => {
            opts = data.options;
            document.getElementById('title').innerText = data.question;
            lastVotes = data.votes;
            built = false;
            render(data.votes);
        });

        socket.on('updateVotes', v => {
            const increased = opts
                .map((_, i) => i)
                .filter(i => (v[i] || 0) > (lastVotes[i] || 0));
            lastVotes = v;
            render(v);
            increased.forEach(burstAtOption);
        });

        socket.on('pollError', msg => {
            document.getElementById('chart').innerHTML = `<p class="error-state">${msg}</p>`;
        });

        function setMode(m) {
            mode = m;
            document.getElementById('chart').className = m;
            document.getElementById('btn-horizontal').classList.toggle('active', m === 'horizontal');
            document.getElementById('btn-vertical').classList.toggle('active', m === 'vertical');
            built = false;
            render(lastVotes);
        }

        function computeRows(votes) {
            const total = Object.values(votes).reduce((a, b) => a + b, 0) || 0;
            return opts.map((text, i) => {
                const count = votes[i] || 0;
                const p = total > 0 ? (count / total * 100).toFixed(1) : "0.0";
                return { text, count, p };
            });
        }

        // Builds fresh DOM (data-index tagged) when the structure changes, otherwise
        // updates existing elements in place so the CSS width/height transitions animate.
        function render(votes) {
            const rows = computeRows(votes);
            const chart = document.getElementById('chart');

            if (!built || chart.children.length !== rows.length) {
                chart.innerHTML = '';
                if (mode === 'horizontal') {
                    rows.forEach((row, i) => {
                        const wrap = document.createElement('div');
                        wrap.className = 'row-wrap';
                        wrap.dataset.index = i;
                        wrap.innerHTML = `
                            <div class="label-row"><span>${row.text}</span><span class="count-label"></span></div>
                            <div class="bar-container"><div class="bar" style="width:0%"></div></div>
                        `;
                        chart.appendChild(wrap);
                    });
                } else {
                    rows.forEach((row, i) => {
                        const col = document.createElement('div');
                        col.className = 'col';
                        col.dataset.index = i;
                        col.innerHTML = `
                            <div class="v-count"></div>
                            <div class="v-bar-wrap"><div class="v-bar" style="height:0%"></div></div>
                            <div class="v-label">${row.text}<br><span style="color:var(--primary-dark)" class="v-percent"></span></div>
                        `;
                        chart.appendChild(col);
                    });
                }
                built = true;
                // Force a layout pass so the browser registers the 0% starting state
                // before we set the real values, otherwise the transition is skipped.
                requestAnimationFrame(() => applyValues(rows));
            } else {
                applyValues(rows);
            }
        }

        function applyValues(rows) {
            rows.forEach((row, i) => {
                if (mode === 'horizontal') {
                    const wrap = document.querySelector(`.row-wrap[data-index="${i}"]`);
                    if (!wrap) return;
                    wrap.querySelector('.bar').style.width = `${row.p}%`;
                    wrap.querySelector('.count-label').textContent = `${row.count} Oy (%${row.p})`;
                } else {
                    const col = document.querySelector(`.col[data-index="${i}"]`);
                    if (!col) return;
                    col.querySelector('.v-bar').style.height = `${row.p}%`;
                    col.querySelector('.v-count').textContent = row.count;
                    col.querySelector('.v-percent').textContent = `%${row.p}`;
                }
            });
        }

        function burstAtOption(i) {
            if (!window.spawnEmojiBurst) return;
            const el = mode === 'horizontal'
                ? document.querySelector(`.row-wrap[data-index="${i}"] .bar-container`)
                : document.querySelector(`.col[data-index="${i}"] .v-bar-wrap`);
            if (!el) return;
            const rect = el.getBoundingClientRect();
            spawnEmojiBurst(rect.left + rect.width / 2, rect.top, 8);
        }
    </script>
</body>

</html>
