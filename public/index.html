<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oy Ver</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, #eef0ff 0%, #f7f7fb 45%, #eef1fb 100%);
    position: relative; overflow-x: hidden;
  }
  .blob { position: fixed; width: 46vmax; height: 46vmax; max-width: 640px; max-height: 640px; border-radius: 50%;
    filter: blur(70px); opacity: 0.5; z-index: 0; animation: blobMove 5s ease-in-out infinite; pointer-events: none; }
  .blob-a { background: #a855f7; top: -12%; left: -10%; }
  .blob-b { background: #ff7a2e; bottom: -14%; right: -8%; animation-delay: -2.5s; }
  @keyframes blobMove { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(12%, -10%) scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
  .card {
    width: min(94vw, 520px); background: #ffffff; border-radius: 32px; padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px);
    box-shadow: 0 30px 60px -20px rgba(60, 50, 130, 0.18), 0 4px 12px rgba(60, 50, 130, 0.06);
    text-align: center; position: relative; z-index: 1;
  }
  .title { margin: 0 0 40px; font-weight: 800; font-size: clamp(38px, 7.5vw, 62px); line-height: 1; letter-spacing: -0.02em;
    display: flex; justify-content: center; flex-wrap: wrap; gap: 0.3em; position: relative; }
  .title .word {
    display: inline-flex; flex: 0 0 auto;
  }
  .title .letter {
    display: inline-block;
    background-image: linear-gradient(90deg, #ea580c, #ff3d5e, #a855f7, #5b52e8, #ea580c);
    background-repeat: repeat-x; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 14px rgba(255, 61, 94, 0.28));
    cursor: default;
  }

  .field { position: relative; margin-bottom: 16px; }
  .digit-row { display: flex; gap: 10px; justify-content: center; }
  .digit-box { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 14px; background: #f2f2f6;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; color: #4b4b57;
    font-feature-settings: "tnum" 1; transition: background .15s ease, transform .2s ease; }
  .digit-box[hidden] { display: none; }
  .digit-box.filled { background: #ede8ff; }
  .field:focus-within .digit-box.active { box-shadow: 0 0 0 3px #7e22ce inset; }
  .digit-box.pop { animation: digitPop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes digitPop { 0% { transform: scale(1); } 45% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .code-input {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: none; outline: none;
  }
  .turnstile { display: flex; justify-content: center; margin-bottom: 12px; }
  .error { min-height: 20px; margin: 0 0 8px; color: #c81e45; font-size: 14px; font-weight: 600; }

  .btn-join {
    width: 100%; border: none; border-radius: 18px; padding: 18px; font: inherit; font-weight: 700; font-size: 17px;
    color: #fff; letter-spacing: 0.01em; cursor: pointer;
    background: linear-gradient(90deg, #4f46e5, #7e22ce); background-size: 160% auto; background-position: 0 0;
    box-shadow: 0 14px 26px -10px rgba(123, 76, 232, 0.55);
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, background-position .3s ease;
    transform-origin: 10% 0%;
  }
  .btn-join:hover { transform: translateY(-2px); background-position: 100% 0; box-shadow: 0 18px 30px -10px rgba(123, 76, 232, 0.6); }
  .btn-join:active { transform: translateY(0); }
  .btn-join:focus-visible { outline: 3px solid #7e22ce; outline-offset: 2px; }

  .poll { display: none; margin-top: 32px; padding-top: 28px; border-top: 2px dashed #ece9f7; text-align: left; }
  .poll[data-active] { display: block; animation: rise .35s ease; }
  @keyframes rise { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
  .poll-q { margin: 0 0 4px; font-size: 20px; font-weight: 800; color: #38364a; }
  .poll-q:focus { outline: none; } /* focused by script only, as a reading start point */
  .poll-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: #7e22ce; margin-bottom: 16px; }
  .poll-live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff3d5e;
    animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.5; } }
  .poll-live.urgent { color: #c81e45; }
  .poll-live.closed { color: #6b6880; }
  .poll-live.closed::before { background: #c9c7d6; animation: none; }
  .poll-options { display: flex; flex-direction: column; gap: 10px; }
  .poll-opt { position: relative; display: block; width: 100%; text-align: left; border: none; border-radius: 14px;
    background: #f4f3f9; padding: 14px 16px; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; color: #38364a;
    overflow: hidden; transition: transform .15s ease; }
  .poll-opt:hover { transform: translateX(3px); }
  .poll-opt:disabled { cursor: default; }
  .poll-opt .fill { position: absolute; inset: 0; width: 0%; z-index: 0;
    background: linear-gradient(90deg, rgba(91, 82, 232, 0.18), rgba(168, 85, 247, 0.28));
    transition: width .6s ease; transition-delay: var(--bardelay, 0s); }
  .poll-opt .row2 { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 12px; }
  .poll-opt:focus-visible { outline: 3px solid #7e22ce; outline-offset: 2px; }
  .poll-opt .pct { color: #7e22ce; display: none; font-feature-settings: "tnum" 1; }
  .poll[data-voted] .fill, .poll[data-voted] .pct { display: revert; }
  .poll-foot { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: #6b6880; }
  .conn { margin: 16px 0 0; font-size: 13px; font-weight: 600; color: #c81e45; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .create { margin-top: 28px; padding-top: 24px; border-top: 2px dashed #ece9f7; }
  .btn-create {
    width: 100%; border: 2px solid #d9d2fb; border-radius: 18px; padding: 14px; font: inherit; font-weight: 700; font-size: 16px;
    color: #5b52e8; background: #fff; cursor: pointer; transition: background .2s ease, transform .2s ease;
  }
  .btn-create:hover { background: #f5f2ff; transform: translateY(-1px); }
  .btn-create:focus-visible { outline: 3px solid #7e22ce; outline-offset: 2px; }
  .btn-create:disabled { opacity: .6; cursor: default; transform: none; }
  .my-polls { margin-top: 18px; text-align: left; }
  .my-polls h2 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6880; }
  .my-polls ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 232px; overflow-y: auto; }
  .my-polls a { display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; border-radius: 12px; background: #f4f3f9;
    color: #38364a; text-decoration: none; font-weight: 600; font-size: 14px; }
  .my-polls a:hover { background: #ede8ff; }
  .my-polls a:focus-visible { outline: 3px solid #7e22ce; outline-offset: 2px; }
  .my-polls .code { color: #8b3fe0; font-feature-settings: "tnum" 1; letter-spacing: 0.1em; }
  .my-polls .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="blob blob-a" aria-hidden="true"></div>
<div class="blob blob-b" aria-hidden="true"></div>
<main class="card">
  <h1 class="title" id="title" aria-label="Ankete Katıl"></h1>

  <form id="join-form" novalidate>
    <div class="field">
      <div class="digit-row" id="digit-row">
        <div class="digit-box"></div>
        <div class="digit-box"></div>
        <div class="digit-box"></div>
        <div class="digit-box"></div>
        <div class="digit-box" hidden></div>
      </div>
      <input class="code-input" id="join-code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" aria-describedby="join-error" aria-label="Anket kodu" />
    </div>
    <p class="error" id="join-error" role="alert"></p>
    <div class="turnstile" id="turnstile" hidden></div>
    <button type="submit" class="btn-join">Katıl</button>

    <div class="create">
      <button type="button" class="btn-create" id="btn-create">+ Yeni anket oluştur</button>
      <p class="error" id="create-error" role="alert"></p>
      <div class="my-polls" id="my-polls" hidden>
        <h2>Bu tarayıcıda oluşturduğun anketler</h2>
        <ul id="my-polls-list"></ul>
      </div>
    </div>
  </form>

  <div class="poll" id="poll">
    <p class="poll-q" id="poll-q" tabindex="-1"></p>
    <span class="poll-live" id="poll-live">Canlı</span>
    <div class="poll-options" id="poll-options"></div>
    <p class="poll-foot" id="poll-foot"></p>
  </div>
  <p class="conn" id="conn" role="status" hidden>Bağlantı koptu, yeniden bağlanılıyor…</p>
  <!-- Announces events (vote recorded, voting closed) to screen readers. -->
  <p class="sr-only" id="sr-status" role="status"></p>
</main>

<script src="/js/voting-timer.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
