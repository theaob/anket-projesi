<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anket Raporu</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root { --ink: #2a2840; --muted: #6b6880; --line: #ece9f7; --track: #f4f3f9; --accent: #7e22ce; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink);
    background: #f4f3f9; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .toolbar a { color: #5b52e8; font-weight: 600; text-decoration: none; font-size: 14px; }
  .toolbar button { font: inherit; font-weight: 700; font-size: 14px; color: #fff; border: none; border-radius: 12px; padding: 10px 16px;
    background: linear-gradient(135deg, #4f46e5, #7e22ce); cursor: pointer; }
  .toolbar :focus-visible { outline: 3px solid #7e22ce; outline-offset: 2px; }

  .page { max-width: 820px; margin: 24px auto; padding: 40px 44px; background: #fff; border-radius: 18px;
    box-shadow: 0 20px 50px -24px rgba(60, 50, 130, .25); }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 6px 0 10px; font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .meta { margin: 0; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .meta strong { color: var(--ink); font-weight: 600; }
  h2 { margin: 32px 0 12px; font-size: 15px; font-weight: 700; }
  h2 small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
  .tile { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile strong { display: block; margin-top: 4px; font-size: 24px; font-weight: 800; font-feature-settings: "tnum" 1; }

  /* Results: one bar per option, value at the tip; the table below repeats
     the numbers for reading and for screen readers. */
  .bars { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 10px 14px; align-items: center; }
  .bars .label { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .bars .track { display: flex; align-items: center; gap: 8px; }
  .bars .fill { height: 18px; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; }
  .bars .value { font-size: 13px; color: var(--ink); white-space: nowrap; font-feature-settings: "tnum" 1; }
  .bars .value small { color: var(--muted); margin-left: 4px; }

  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--muted); font-family: inherit; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .col { fill: var(--accent); }
  .chart .col:hover { opacity: .8; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 700; }
  td.num, th.num { text-align: right; font-feature-settings: "tnum" 1; }
  tfoot td { font-weight: 700; border-bottom: none; }
  .empty { color: var(--muted); font-size: 14px; }
  .foot { margin: 28px 0 0; color: var(--muted); font-size: 12px; }
  .message { max-width: 520px; margin: 80px auto; padding: 24px; text-align: center; font-weight: 600; color: var(--muted); }

  @media (max-width: 640px) {
    .page { margin: 0; border-radius: 0; padding: 24px 16px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bars { grid-template-columns: 1fr; gap: 4px; }
    .bars .track { margin-bottom: 8px; }
  }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    .toolbar { display: none; }
    .page { margin: 0; padding: 0; max-width: none; box-shadow: none; border-radius: 0; }
    section, .tiles, tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<nav class="toolbar" id="toolbar" hidden>
  <a id="back" href="/">← Anketi yönet</a>
  <button type="button" id="btn-print">PDF olarak kaydet / Yazdır</button>
</nav>
<p class="message" id="message" role="status">Rapor hazırlanıyor…</p>

<main class="page" id="page" hidden>
  <p class="eyebrow">Anket raporu</p>
  <h1 id="question"></h1>
  <p class="meta" id="meta"></p>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>Sonuçlar <small id="total"></small></h2>
    <div class="bars" id="bars" aria-hidden="true"></div>
    <p class="empty" id="no-options" hidden>Bu ankette henüz seçenek yok.</p>
  </section>

  <section id="timeline-section">
    <h2>Zamana göre oylar <small id="bucket"></small></h2>
    <div id="timeline"></div>
  </section>

  <section>
    <h2>Sonuç tablosu</h2>
    <table>
      <thead><tr><th>Seçenek</th><th class="num">Oy</th><th class="num">Yüzde</th></tr></thead>
      <tbody id="table"></tbody>
      <tfoot><tr><td>Toplam</td><td class="num" id="table-total"></td><td class="num" id="table-total-pct"></td></tr></tfoot>
    </table>
  </section>

  <p class="foot" id="foot"></p>
</main>

<script src="/js/report.js"></script>
</body>
</html>
